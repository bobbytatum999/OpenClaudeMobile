name: OpenClaudeMobile
options:
  bundleIdPrefix: com.nightvibes
  deploymentTarget:
    iOS: '26.0'
packages:
  llama.swift:
    url: https://github.com/mattt/llama.swift
    exactVersion: 2.8611.0
settings:
  base:
    PRODUCT_NAME: OpenClaudeMobile
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0.0'
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SUPPORTS_MACCATALYST: NO
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    LIBRARY_SEARCH_PATHS:
      - $(inherited)
targets:
  OpenClaudeMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: llama.swift
        product: LlamaSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes.openclaudemobile
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenClaude
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: OpenClaude Mobile runs a localhost API server and can connect to LAN inference endpoints.
        INFOPLIST_KEY_NSBonjourServices:
          - _openclaude._tcp
        INFOPLIST_KEY_UIBackgroundModes:
          - processing
          - fetch
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLName: com.nightvibes.openclaudemobile
            CFBundleURLSchemes:
              - openclaudemobile
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        OTHER_LDFLAGS:
          - -ObjC
  OpenClaudeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenClaudeMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes.openclaudemobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenClaudeMobile:
    build:
      targets:
        OpenClaudeMobile: [run, test, profile, analyze, archive]
    archive:
      config: Release
