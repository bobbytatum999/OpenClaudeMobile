<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5" />
      <stop offset="100%" style="stop-color:#9333EA" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded Rect Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg_grad)" />
  
  <!-- Central Shield Motif -->
  <path d="M512 180C512 180 320 220 320 380V600C320 740 512 844 512 844C512 844 704 740 704 600V380C704 220 512 180 512 180Z" fill="white" filter="url(#shadow)" />
  
  <!-- Bolt Symbol inside Shield -->
  <path d="M540 320L400 520H500L484 704L624 504H524L540 320Z" fill="url(#bg_grad)" />
</svg>
