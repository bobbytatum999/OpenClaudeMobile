name: Build Unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          latest_xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using Xcode at: $latest_xcode"
          sudo xcode-select -s "$latest_xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Inspect project structure
        run: |
          xcodebuild -list -project OpenClaudeMobile.xcodeproj
          xcodebuild -showBuildSettings -project OpenClaudeMobile.xcodeproj -scheme OpenClaudeMobile

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenClaudeMobile.xcodeproj \
            -scheme OpenClaudeMobile

      - name: Archive unsigned iPhone build
        run: |
          xcodebuild archive \
            -project OpenClaudeMobile.xcodeproj \
            -scheme OpenClaudeMobile \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenClaudeMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates \
            clean

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          app_path="build/OpenClaudeMobile.xcarchive/Products/Applications/OpenClaudeMobile.app"
          cp -R "$app_path" build/Payload/
          cd build
          /usr/bin/zip -qry OpenClaudeMobile-unsigned.ipa Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaudeMobile-unsigned
          path: |
            build/OpenClaudeMobile.xcarchive
            build/OpenClaudeMobile-unsigned.ipa
